[package]
name = "gdxrs"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
description = "Independent bounded-memory GDX v7 reader"
publish = false

[dependencies]
miniz_oxide = { version = "=0.9.1", default-features = false, optional = true }

sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"], optional = true }

[features]
default = ["compression"]
compression = ["dep:miniz_oxide", "miniz_oxide/with-alloc"]
index = ["dep:sha2"]
